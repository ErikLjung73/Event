<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Knytkalas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseClient =
  window.supabase.createClient(
   "https://ddypvmxbtileaqpafvkx.supabase.co",
   "sb_publishable_fDCqoOdCWVmsPlJJ4ztCdg_vFNBSbAv"
  );

let currentEventId = null;
  let members = [];

async function loadParty() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
  params.get('code');

  if (!code) {

  document.getElementById(
  'activePartyTitle'
).style.display = 'none';
    document.getElementById(
  'selectedParty'
).style.display = 'none';

  document.getElementById('eventName')
  .textContent = '';

  return;

}

  const { data, error } =
    await supabaseClient
      .from('events')
      .select('*')
      .eq('event_code', code)
      .single();

  if (error) {

    console.log(error);

    document.getElementById('eventName')
      .textContent =
      '';

    return;

  }

  currentEventId = data.id;

  document
  .getElementById('selectedParty')
  .classList.add('party-selected');

  document.getElementById(
  'activePartyTitle'
).style.display = 'block';
  
  document.getElementById('eventName')
    .textContent =
    `🎉 ${data.name}`;

  await loadMembers();
  loadItems();

}

async function loadItems() {

  if (!currentEventId) return;

  const { data, error } =
    await supabaseClient
      .from('items')
      .select('*')
      .eq('event_id', currentEventId)
      .order('created_at', {
        ascending: true
      });

  if (error) {
    console.log(error);
    return;
  }

  const div =
    document.getElementById('itemList');

  
  
  div.innerHTML = '';

  data.forEach(item => {

    const options =
  members.map(member => `
    <option
      value="${member.name}"
      ${item.taken_by === member.name ? 'selected' : ''}>

      ${member.name}

    </option>
  `).join('');

    div.innerHTML += `
    <div class="item-row ${
      item.taken_by
          ? 'taken'
          : 'available'
        }">
      <span class="item-name">
        ${item.item_name}
      </span>

    <span class="item-owner">

  <select
    onchange="assignItem(
      '${item.id}',
      this.value
    )">

    <option value="">
      Ledig
    </option>

    ${options}

  </select>


    <button
  onclick="deleteItem('${item.id}')">

  🗑️

</button>
</span>

    </div>
  `;

  });

}

async function takeItem(id) {

  const name =
    prompt(
      'Vad heter du?'
    );

  if (!name) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('items')
      .update({
        taken_by: name
      })
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadItems();

}


async function addItem() {

  const itemName =
    document.getElementById('itemName')
      .value
      .trim();

  if (!itemName) return;

  const { error } =
    await supabaseClient
      .from('items')
      .insert({
        event_id: currentEventId,
        item_name: itemName
      });

  if (error) {
    console.log(error);
    return;
  }

  document.getElementById('itemName').value = '';

  loadItems();

}

async function deleteItem(id) {

  if (
    !confirm('Radera?')
  ) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('items')
      .delete()
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadItems();

}

async function createParty() {

  const name =
    document.getElementById('eventNameInput')
      .value
      .trim();

  const code =
  Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();

  if (!name) {
    alert('Ange namn på event');
    return;
  }

  const { data, error } =
  await supabaseClient
    .from('events')
    .insert({
      name: name,
      event_code: code
    })
    .select()
    .single();

  if (error) {
    console.log(error);
    alert('Kunde inte skapa event');
    return;
  }

  currentEventId = data.id;

document.getElementById('eventName')
  .textContent =
  `🎉 ${data.name}`;

document.getElementById('selectedParty')
  .classList.add('party-selected');

document.getElementById('activePartyTitle')
  .style.display = 'block';

loadPartyList();
  loadItems();

}
  
async function loadPartyList() {

  const { data, error } =
    await supabaseClient
      .from('events')
      .select('*')
      .order('created_at', {
        ascending: false
      });

  if (error) {
    console.log(error);
    return;
  }

  const div =
    document.getElementById('partyList');

  div.innerHTML = '';

  data.forEach(party => {

    div.innerHTML += `
      <div
        class="party-row"
        onclick="openParty('${party.event_code}')">

        🎉 ${party.name}

      </div>
    `;

  });
}

async function takeItem(id) {

  const name =
    prompt('Vad heter du?');

  if (!name) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('items')
      .update({
        taken_by: name
      })
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadItems();

}

async function addMember() {

  const name =
    document.getElementById('memberName')
      .value
      .trim();

  if (!name || !currentEventId) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('party_members')
      .insert({
        event_id: currentEventId,
        name: name
      });

  if (error) {
    console.log(error);
    return;
  }

  document.getElementById('memberName').value = '';

  await loadMembers();
  loadItems();
}

  async function loadMembers() {

  if (!currentEventId) {
    return;
  }

  const { data, error } =
    await supabaseClient
      .from('party_members')
      .select('*')
      .eq('event_id', currentEventId);

  if (error) {
    console.log(error);
    return;
  }

    members = data;

  const div =
    document.getElementById('memberList');

  div.innerHTML = '';

  data.forEach(member => {
  div.innerHTML += `
    <div class="participant-row">
    <span>
      👤 ${member.name}
    </span>

    <button
      onclick="deleteMember('${member.id}')">

      🗑️

    </button>

    </div>
    `;

  });

}

  async function assignItem(id, name) {

  const { error } =
    await supabaseClient
      .from('items')
      .update({
        taken_by: name || null
      })
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadItems();

}

  async function deleteMember(id) {

  if (
    !confirm(
      'Ta bort deltagaren?'
    )
  ) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('party_members')
      .delete()
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadMembers();

}

function openParty(code) {

  window.location.href =
    `?code=${code}`;

}

window.onload = () => {

  loadParty();

  loadPartyList();

};
  
</script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f7f8fb;
}

.card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

button {
  background: #7289C8;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 10px 14px;
}

button:hover {
  background: #6178B8;
}

input {
  padding: 10px;
}

.item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 10px;
  margin-bottom: 8px;

  border-radius: 6px;

  background: #f8f4e8;
}

.item-owner {
  display: flex;
  align-items: center;
  gap: 6px;
}

.item-owner button {
  margin: 0;
  width: auto;
}
  
#selectedParty {
  background: white;
  border: 1px solid #d5dfef;
}

#selectedParty h2 {
  color: white;
}

.party-selected {
  background: #e9eff8 !important;
  border: 1px solid #d5dfef;
}

.party-selected h2 {
  color: #556b94;
}

.party-row {
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
  cursor: pointer;
  background: #f5f7fb;
}

.party-row:hover {
  background: #e9eff8;
}

.party-row.selected {
  background: #dce5f5;
  color: #31508a;
  font-weight: 600;
}

#activePartyTitle {
  margin-top: 25px;
  margin-bottom: 10px;
  color: #556b94;
}

.item-row.available {
  background: #f8f2f2;
  border-left: 4px solid #e4caca;
}

.item-row.taken {
  background: #f2f8f2;
  border-left: 4px solid #cae4cc;
}

.participant-row {
  gap: 15px;
}


@media (max-width: 768px) {

  input,
  button {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
  }

}

</style>

</head>

<body>

<h1>🎉 Knytkalas</h1>

<div class="card">

  <h3>🎉 Skapa event</h3>

  <input
    id="eventNameInput"
    placeholder="Eventnamn">


  <button onclick="createParty()">
    Skapa event
  </button>

</div>

<div class="card">
  <h3>📋 Mina knytkalas</h3>
  <div id="partyList"></div>
</div>

<h3 id="activePartyTitle">
  🎯 Aktivt knytkalas
</h3>

<div class="card" id="selectedParty">

  <h2 id="eventName">
    Välj ett knytkalas
  </h2>

</div>

<div class="card">

  <h3>👥 Deltagare</h3>

  <div id="memberList"></div>

  <input
    id="memberName"
    placeholder="Namn">

  <button onclick="addMember()">
    Lägg till
  </button>

</div>

<div class="card">
  <h3>🍽️ Att ta med</h3>
  <div id="itemList"></div>
</div>


<div class="card">

  <h3>➕ Lägg till något</h3>

  <input
    id="itemName"
    placeholder="T.ex. Potatissallad">

  <button onclick="addItem()">
    Lägg till
  </button>

</div>

</body>

</html>
