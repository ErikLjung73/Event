<!DOCTYPE html>
<html lang="sv">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Knytkalas</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<script>

const supabaseClient =
  window.supabase.createClient(
   "https://ddypvmxbtileaqpafvkx.supabase.co",
   "sb_publishable_fDCqoOdCWVmsPlJJ4ztCdg_vFNBSbAv"
  );

let currentEventId = null;

async function loadParty() {

  const params =
    new URLSearchParams(
      window.location.search
    );

  const code =
  params.get('code');

  if (!code) {

    document.getElementById('eventName')
      .textContent =
      'Skapa ett nytt knytkalas ovan';

    return;

  }

  const { data, error } =
    await supabaseClient
      .from('events')
      .select('*')
      .eq('event_code', code)
      .single();

  if (error) {

    console.log(error);

    document.getElementById('eventName')
      .textContent =
      '';

    return;

  }

  currentEventId = data.id;

  document.getElementById('eventName')
    .textContent =
    `🎉 ${data.name}`;

  loadItems();

}

async function loadItems() {

  if (!currentEventId) return;

  const { data, error } =
    await supabaseClient
      .from('items')
      .select('*')
      .eq('event_id', currentEventId);

  if (error) {
    console.log(error);
    return;
  }

  const div =
    document.getElementById('itemList');

  div.innerHTML = '';

  data.forEach(item => {

    div.innerHTML += `
      <div class="item-row">

      <span class="item-name">
        ${item.item_name}
      </span>

    <span class="item-owner">
      ${
        item.taken_by
          ? `✅ ${item.taken_by}`
          : `⏳ Ledig`
      }
    </span>

    </div>
  `;

  });

}

async function takeItem(id) {

  const name =
    prompt(
      'Vad heter du?'
    );

  if (!name) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('items')
      .update({
        taken_by: name
      })
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadItems();

}


async function addItem() {

  const itemName =
    document.getElementById('itemName')
      .value
      .trim();

  if (!itemName) return;

  const { error } =
    await supabaseClient
      .from('items')
      .insert({
        event_id: currentEventId,
        item_name: itemName
      });

  if (error) {
    console.log(error);
    return;
  }

  document.getElementById('itemName').value = '';

  loadItems();

}

async function deleteItem(id) {

  if (
    !confirm('Radera?')
  ) {
    return;
  }

  const { error } =
    await supabaseClient
      .from('items')
      .delete()
      .eq('id', id);

  if (error) {
    console.log(error);
    return;
  }

  loadItems();

}

async function createParty() {

  const name =
    document.getElementById('eventNameInput')
      .value
      .trim();

  const code =
  Math.random()
    .toString(36)
    .substring(2, 8)
    .toUpperCase();

  if (!name) {
    alert('Ange namn på event');
    return;
  }

  const { error } =
    await supabaseClient
      .from('events')
      .insert({
        name: name,
        event_code: code
      });

  if (error) {
    console.log(error);
    alert('Kunde inte skapa event');
    return;
  }

  alert(
    `Event skapat!`);
    window.location.href =
    `${window.location.pathname}?code=${code}`;
}

window.onload = loadParty;

</script>

<style>

body {
  font-family: Arial, sans-serif;
  max-width: 900px;
  margin: auto;
  padding: 20px;
  background: #f7f8fb;
}

.card {
  border: 1px solid #ddd;
  border-radius: 10px;
  padding: 15px;
  margin-bottom: 20px;
  background: white;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

button {
  background: #7289C8;
  color: white;
  border: none;
  border-radius: 6px;
  padding: 10px 14px;
}

button:hover {
  background: #6178B8;
}

input {
  padding: 10px;
}

.item-row {
  display: flex;
  justify-content: space-between;
  align-items: center;

  padding: 10px;
  margin-bottom: 8px;

  border-radius: 6px;

  background: #f8f4e8;
}

.item-owner {
  color: #556b94;
  font-weight: 500;
}

#selectedParty {
  background: #e9eff8;
  border: 1px solid #d5dfef;
}

#selectedParty h2 {
  color: #556b94;
}

@media (max-width: 768px) {

  input,
  button {
    width: 100%;
    box-sizing: border-box;
    margin-bottom: 10px;
  }

}

</style>

</head>

<body>

<h1>🎉 Knytkalas</h1>

<div class="card">

  <h3>🎉 Skapa event</h3>

  <input
    id="eventNameInput"
    placeholder="Eventnamn">


  <button onclick="createParty()">
    Skapa event
  </button>

</div>

<div class="card" id="selectedParty">
  <h2 id="eventName">
    Laddar...
  </h2>
</div>

<div class="card">
  <h3>🍽️ Att ta med</h3>
  <div id="itemList"></div>
</div>


<div class="card">

  <h3>➕ Lägg till något</h3>

  <input
    id="itemName"
    placeholder="T.ex. Potatissallad">

  <button onclick="addItem()">
    Lägg till
  </button>

</div>

</body>

</html>
